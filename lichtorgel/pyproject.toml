[project]
name = "lichtorgel"
version = "0.1.0"
description = "Drive Philips Hue entertainment lights from live audio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hueify[entertainment]",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
sounddevice = ["sounddevice>=0.5.2"]

# Pinned to an unreleased hueify commit for its hardened entertainment stream.
# That commit still reports version 0.8.1, so the pin is the commit, not a
# version range. Move back to a PyPI release once hueify publishes one.
[tool.uv.sources]
hueify = { git = "https://github.com/mathisarends/hueify", rev = "9f5c060c0db9d56a778589cfb70a97b285b2d4c4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lichtorgel"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config --cov=lichtorgel --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["lichtorgel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
