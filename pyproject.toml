[project]
name = "lichtorgel-workspace"
version = "0.1.0"
description = "Drive Philips Hue entertainment lights from live audio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["lichtorgel", "server"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["lichtorgel/tests", "server/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
