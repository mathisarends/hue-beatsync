[project]
name = "hue-beatsync"
version = "0.1.0"
description = "Drive Philips Hue entertainment lights from live audio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hueify[entertainment]>=0.9.0",
    "numpy>=2.5.1",
]

[project.optional-dependencies]
cli = [
    "click>=8.3.1",
    "sounddevice>=0.5.2",
]
sounddevice = ["sounddevice>=0.5.2"]

[project.scripts]
hue-beatsync = "hue_beatsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "click>=8.3.1",
    "coverage[toml]>=7.15.4",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config --cov=hue_beatsync --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hue_beatsync"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
