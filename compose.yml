services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8765:8765"
    # Hue bridge credentials (HUE_BRIDGE_IP, HUE_APP_KEY, HUE_CLIENT_KEY).
    # Environment beats the .env file in hueify's lookup order, so the values
    # reach the container without baking .env into the image.
    env_file:
      - .env
    volumes:
      - ./lichtorgel.yml:/app/lichtorgel.yml
    restart: unless-stopped
    # The container has no sound hardware of its own, so /devices is empty and
    # /start cannot capture anything. On a Linux host, uncomment both lines to
    # hand the host's ALSA devices to the container. On Windows and macOS there
    # is nothing to pass through - run the server natively instead
    # (scripts/serve.ps1).
    # devices:
    #   - /dev/snd
    # group_add:
    #   - audio
