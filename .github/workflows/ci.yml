name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files 'cli/**/*.go' | grep -v '/oas_.*_gen\.go$'))"

      - name: Vet
        run: go vet ./...
        working-directory: cli

      - name: Test
        run: go test -race ./...
        working-directory: cli

      # The generated client is only trustworthy while it matches the server it
      # was generated from.
      - name: Check the API client is up to date
        run: |
          uv sync --all-extras --dev
          uv run --package lichtorgel-server python scripts/export_openapi.py
          (cd cli && go generate ./...)
          git diff --exit-code -- specs/openapi.json cli/internal/client
