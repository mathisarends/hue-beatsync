name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # sounddevice loads PortAudio when it is imported.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # Without --all-packages, uv installs only the workspace root, which has
      # no code of its own, and neither lichtorgel nor server is importable.
      - name: Install dependencies
        run: uv sync --all-packages --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
