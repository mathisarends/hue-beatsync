[project]
name = "lichtorgel-server"
version = "0.1.0"
description = "Minimal API server that manages a long-running Lichtorgel process"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lichtorgel[sounddevice]",
    "dishka>=1.4.0",
    "fastapi>=0.124.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
lichtorgel = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
